[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-launcher"
version = "0.3.0"
description = "An agent-friendly command launcher for KDE Plasma"
readme = "README.md"
authors = [{ name = "Vaibhav Pandit" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
    "Topic :: System :: System Shells",
    "Topic :: Utilities",
]
keywords = ["kde", "plasma", "launcher", "command-palette", "qt6", "productivity", "agent"]
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4.0",
]

[project.scripts]
lumen = "lumen.__main__:main"

[project.urls]
Homepage = "https://github.com/VaibhavPandit-09/lumen"
Repository = "https://github.com/VaibhavPandit-09/lumen.git"
Issues = "https://github.com/VaibhavPandit-09/lumen/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lumen*"]
