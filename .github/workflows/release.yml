name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools and Qt 6 dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev debhelper dh-python python3-all python3-setuptools libgl1-mesa-glx libegl1 libxkbcommon-x11-0 libdbus-1-3
        python -m pip install --upgrade pip build wheel PyQt6

    - name: Run Test Suite (Headless Offscreen)
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v

    - name: Build Python Distribution Artifacts
      run: |
        python -m build --sdist --wheel --outdir dist/

    - name: Build Debian Package (.deb)
      run: |
        dpkg-buildpackage -us -uc -b
        mkdir -p release-artifacts
        cp ../lumen_*.deb release-artifacts/ 2>/dev/null || true
        cp dist/* release-artifacts/

    - name: Generate Checksums (SHA256SUMS)
      working-directory: release-artifacts
      run: |
        sha256sum * > SHA256SUMS
        cat SHA256SUMS

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-artifacts/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
